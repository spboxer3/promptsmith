<!DOCTYPE html>
<html lang="en">
<head>

    <title>PromptSmith History Feature Tests</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; }

        .fail { color: red; font-weight: bold; }

        import { StorageService, KEYS } from '../src/lib/storage.js';
        import { runTests } from './history_test.js';

        // Expose to window for the test runner if needed, or just run here
        window.StorageService = StorageService;
        window.KEYS = KEYS;
        
        runTests();
    </script>
