<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="../lib/font-awesome.css">
</head>

<body>
    <header>
        <div class="header-left">
            <h1>PromptSmith</h1>
            <span class="version" id="extensionVersion"></span>
        </div>
        <button type="button" id="openSettings" class="icon-btn" title="Settings" aria-label="Settings"
                data-i18n-attrs="title=navSettings;aria-label=navSettings"><i
                class="fa-solid fa-gear"></i></button>
    </header>

    <main>
        <div class="status-card" role="status" aria-live="polite">
            <span class="status-dot active"></span>
            <span class="status-text" data-i18n="popupReady">Ready to optimize</span>
        </div>

        <div id="whitelistSection" class="whitelist-section" style="display: none;">
            <!-- Dynamic Content -->
        </div>

        <div class="actions">
            <p class="hint"><span data-i18n="popupHint">Select text on any page and press</span> <strong>Cmd+K</strong>
            </p>
        </div>
    </main>

    <script type="module" src="popup.js"></script>
</body>

</html>
